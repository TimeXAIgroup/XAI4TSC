name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Also run the slow integration suite (downloads data, trains models)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Ruff is a standalone binary — no need for the heavy project install.
      - name: Install Ruff
        run: pip install "ruff>=0.15,<0.16"

      - name: Lint
        run: ruff check src/ experiment_runner/ tests/ examples/

      - name: Format check
        run: ruff format --check src/ experiment_runner/ tests/ examples/

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      # --locked fails when uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --group dev --group runner

      - name: Run unit tests with coverage
        run: >
          uv run pytest -m unit
          --cov=xai4tsc --cov=experiment_runner
          --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: Integration tests
    # Only on manual dispatch with the toggle on — too slow/flaky for every push.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_integration }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      # --locked fails when uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --group dev --group runner

      - name: Run integration tests
        run: uv run pytest -m integration
