# =============================================================================
# example.yaml — the go-to demo for xai4tsc (time domain).
#
# This is the config the runner uses by default:
#     python -m experiment_runner.main
#
# It needs no download: the synthetic `Synth_Multilabel_Freq` dataset is generated
# locally (and cached). It trains two model architectures, explains them with three
# time-domain XAI methods, and scores those explanations with time-domain
# metrics.
#
# For the frequency / time-frequency counterpart, see `example_frequency.yaml`.
# For an annotated reference of every available option, see `master.yaml`.
# =============================================================================
experiment_name: "example_time"

# Generated datasets, splits, and checkpoints are cached here and reused.
cache_path: "./cache/"

general:
  reproducible: true
  seed: 2025
  device: "use_available"

# The example uses a generated synthetic dataset, a reference can be found in
# the class documentation.
data_config:
  default_settings:
    train_split: 0.7
    val_split: 0.15
  datasets:
    - dataset: "Synth_Multilabel_Freq"   # SyntheticDataset registry key
      encode: "multihot"                 # one output per frequency, not one per combo
      encode_params:
        classes: ["7Hz", "19Hz", "37Hz"]  # names the outputs in the per-output results
      use_predefined_splits: true        # the dataset's own published splits

# --- Models: two different architectures, both trained ---
train_config:
  default_settings:
    hyperparams:
      epochs: 10
      batchsize: 32
      loss_func: "bcewithlogits"   # per-output targets: one independent
                                  # decision per frequency, not one of K
      optimizer: "adam"
      learn_rate: 0.001
      patience: 3
      save_best: true
    train: true
  models:
    - model: "LeNet"                # smallest built-in CNN
    - model: "FCN"                  # fully-convolutional baseline
    # in_channels / num_classes are auto-detected per dataset.

# --- Explainers: three time-domain methods ---
explanation_config:
  default_settings:
    target: "predicted"
    samples:
      type: "random"
      count: 5
  explainers:
    - method: Integrated_Gradients
    - method: Guided_Backpropagation
    - method: TSHAP                 # exact 2-player Shapley over time windows
      window_length: 0.1           # fraction of T per window
      stride: 10                   # compute every 10th window start (bounds cost)
      perturb_baseline: "centroid"
      background_data: train_set

# --- Metrics: time-domain ---
evaluation_config:
  default_settings:
    metric_class_params:
      normalise: true
      abs: true
      disable_warnings: true
      return_aggregate: true
    metric_call_params:
      softmax: false        # the outputs are independent per-label probabilities
                            # already; renormalising them would move every score
  metrics:
    - metric: "Complexity"          # cheap: counts non-zero attributions
    - metric: "Pixel-Flipping"      # faithfulness via progressive perturbation

results_rel_path: "./experiments/results/"
