# Master configuration - the annotated reference for every available option.
#
# REFERENCE ONLY: this file is not runnable. It is read at runtime by
# config_resolve() to supply the defaults of the `general` and `default_settings`
# blocks and to warn about unknown keys. Copy the entries you need into your own
# config; configs/example.yaml is a working starting point.
#
# PARAMETER DEFAULTS LIVE IN THE CODE. The four component lists below
# (datasets, models, explainers, metrics) are a catalogue of what is available:
# their comments name each parameter's default, but this file does not supply
# them, so a value you omit comes from the class that consumes it and the
# importable package and the runner always agree. All four lists are required in
# your own config - they describe what the experiment runs and cannot be
# defaulted.

experiment_name: null       # REQUIRED in your own config

# The xai4tsc versions this config is written for, as a PEP 440 specifier, e.g.
# ">=2.0.0.dev0,<3" (a plain ">=2.0.0" excludes the 2.0.0.dev builds). A bare
# version such as "2.0.0" means exactly that version. Quote the value: YAML
# reads an unquoted 2.10 as the number 2.1.
# The config check rejects the run when the installed xai4tsc does not fit.
# Omitted or null skips the check with a warning.
xai4tsc_version: null

results_rel_path: null      # REQUIRED in your own config, e.g. "./experiments/results/"

# Path to the cache directory.  If set, UCR downloads and dataset splits are
# cached here and reused across runs.  Set to null or omit to disable caching.
#
# Cache layout:
#   {cache_path}/
#     ucr/      ← raw UCR dataset downloads (one sub-folder per dataset name)
#     splits/   ← processed train/val/test splits
#       {dataset}_{params}/  ← folder name encodes all split parameters
#
cache_path: null


general:
  reproducible: true        # Enforce seed-based reproducibility. When false, splits are
                            #   drawn unseeded and the split cache is bypassed entirely
                            #   (neither read nor written), since a random draw cannot be
                            #   described by a cache key. The dataset download cache is
                            #   unaffected.
  seed: 2025                # Run seed. Every result derives its own seed from this one
                            #   and its position in the config (dataset -> split / samples /
                            #   model -> explainer -> metric), so a single result reproduces on
                            #   its own and does not depend on which entries ran before it.
                            #   Every derived seed is logged, and the metric seed is also
                            #   recorded in the metrics.csv 'seed' column. The log is therefore
                            #   enough on its own to replay one result through the package API
                            #   rest. An explicit seed on an entry always wins over the derived
                            #   one; seed: null on an entry opts that component out of seeding
                            #   entirely.
  device: "use_available"   # "use_available", "cpu", "cuda", "mps"
  allow_external_code: false  # allow loading model/explainer/metric classes from
                            #   user-supplied source files (class_name + class_path
                            #   on a model/explainer/metric entry). Executes arbitrary
                            #   Python; opt in explicitly. See the entries below.
  allow_kwargs: false       # allow passing parameters the runner cannot verify. A
                            #   component whose signature ends in **kwargs accepts any
                            #   key, so no inspection can say whether one is read: a
                            #   misspelled name is then either swallowed in silence
                            #   or raised mid-run. While false, such a key is
                            #   reported before the run starts; set it true to pass
                            #   them through unchecked and accept that a typo is
                            #   invisible. Keys matching a named parameter are always
                            #   verified and unaffected by this flag.

data_config:
  default_settings:
    # The values in this block mirror the package defaults.
    train_split: 0.8        # fraction of the samples used for training
    val_split: 0.1          # fraction held out for validation, taken from what training
                            # leaves. 0 produces no validation split, and early stopping
                            # then monitors training loss instead of validation loss.
                            # Ignored by `use_predefined_splits` and `is_presplit`.
    encode: "label"         # which label encoder turns the label column into model targets.
                            # The runner builds the object, the package takes it, and the
                            # fitted encoder names the model's outputs:
                            #   "label":    one int64 class index per sample (default)
                            #   "multihot": multi-hot rows (e.g. [0,1,1]) kept as one target
                            #               column per output. Train it with
                            #               loss_func: "bcewithlogits"
                            #   "powerset": multi-hot rows -> one index per distinct combo,
                            #               the label-powerset reduction.
                            #   a dotted path to an encoder class, e.g.
                            #   "sklearn.preprocessing.MultiLabelBinarizer" when the labels
                            #   are label *sets* rather than multi-hot rows
                            # An unknown name is an error, never a silent fallback.
                            # "onehot" and "ordinal" were removed - use "label".
    encode_params: {}       # constructor arguments for `encode`; most encoders take none.
                            # "multihot" accepts `classes`, the label identity of each
                            # column in order, which is what names the outputs in the
                            # per-output results: {classes: ["7Hz", "19Hz", "37Hz"]}.
    format: "numpy"         # "numpy", "arff", "csv", "wfdb"
    layout: "auto"          # axis order of a local array (ignored for UCR/UEA and synthetic):
                            #   "auto": transpose when axis 1 > axis 2, with a warning
                            #   "bct":  trust as (B, C, T) -- use this when the data genuinely
                            #           has more channels than timesteps, which "auto" corrupts
                            #   "btc":  always transpose
    data_domain: "time"     # signal domain a local array is expressed in, i.e. what the model
                            # trained on it consumes: "time" (raw series, the default),
                            # "frequency" or "time_frequency".
                            # Non-time data must still be real float32 (e.g. magnitude
                            # spectra), and the domain-lifting explainers (Frequency,
                            # TimeFrequency, FreqRISE, Random_Frequency,
                            # Random_TimeFrequency) consume time-domain data only, so pairing
                            # one with a non-time dataset is a config error.
                            # Ignored for UCR/UEA (always raw series) and for synthetic
                            # datasets, which declare their own domain in code.
    download: true          # Download UCR dataset if not found locally
    path: null              # Local path; if set, LocalDataset is used instead of UcrUeaDataset
    is_presplit: false      # true = load directly via load_saved_splits(), bypass cache
    stratify: true          # stratify splits by class label; set to false to opt out
    use_predefined_splits: false  # use the splits the dataset itself defines, ignoring train_split,
                                  # val_split and stratify: the official _TRAIN.ts/_TEST.ts files for
                                  # UCR/UEA (no validation split, so early stopping monitors training
                                  # loss), or the other published splits of dataset that ship one.
                                  # A dataset with no splits of its own reports the request
                                  # and splits by the fractions instead.
    skip_dataset: false     # skip the dataset entirely (no split, train, explain, or evaluate)
    skip_models: false      # split only; skip train, explain, and evaluate
    skip_explainers: false  # split and train only; skip explain and evaluate
    skip_metrics: false     # split, train, and explain; skip evaluate
    allow_padding: false    # zero-pad variable-length series to the longest series length
                            # (the package calls this pad_series, as its errors name it)
    allow_imputation: false # replace NaN values with the per-channel mean before splitting
                            # (the package calls this impute_missing)
    max_samples: null       # subsample to at most N samples; prevents OOM on large datasets (e.g. InsectWingbeat)
    sample_strategy: "random"  # subset selection: "random" | "first" | "last" | "stratified"
    max_series_length: null # truncate each series to at most T timesteps; reduces memory for long-series datasets
    series_position: "first"   # which end to retain when truncating: "first" (start) | "last" (end)
  datasets:                 # REQUIRED. List of {dataset: <name>, ...} entries.
                            # 'dataset' is ALWAYS the human-readable name. Every other key
                            # is a per-entry override of a default_settings value above.
                            # Synthetic datasets are dispatched by the SYNTHETIC_DATASETS
                            # registry key and take no path/download/format.
    - dataset: "GunPoint"   # a UCR/UEA archive dataset, fetched by name
      max_samples: 500      # overrides default_settings for this entry only

    - dataset: "my_recording"   # 'path' switches to LocalDataset instead of UcrUeaDataset
      path: ./data/my_recording
      format: "numpy"       # "numpy" | "arff" | "csv" | "wfdb"
      layout: "bct"         # state the axis order: Batch x Channel x Timesteps
      is_presplit: false    # true = the folder already holds train/test splits

    - dataset: "UEA"        # reserved keyword: all 33 UEA multivariate datasets
                            #   ("UCR" expands to all 128 univariate ones)
      allow_padding: true   # an entry's inline settings apply to every member it expands to
      overrides:            # per-member exceptions; listed members win over the inline
        InsectWingbeat:     #   settings. Priority: overrides[name] > inline > default_settings
          max_samples: 5000
          sample_strategy: "stratified"
          max_series_length: 1000

    - dataset: "Synth_Multilabel_Freq"
                                # synthetic: multi-label bursts localized in time and
                                #   frequency, generated on first use and cached, with
                                #   per-sample ground truth for the localization metrics
      encode: "multihot"        # its labels are multi-hot rows; one output per
                                # frequency. Pair with loss_func: "bcewithlogits"
      init_params:              # generation params (defaults from the dataset class,
                                #   which are the source repository's and reproduce its
                                #   published dataset exactly):
                                #   sample_length: 500            series length T
                                #   sampling_rate: 100            Hz; sets the time axis
                                #                                 and the Nyquist bound
                                #   discriminative_frequencies: [7, 19, 37]
                                #                                 Hz, one per label bit;
                                #                                 classes are their powerset
                                #   frequency_window_length: 150
                                #                                 burst length in samples
                                #   num_samples_per_pattern: 500
                                #                                 total = this x 2^n_freqs
                                #   overlap_min: 0.25             overlap bounds between
                                #   overlap_max: 0.5              consecutive bursts
                                #   noise_std: 0.1
                                #   sin_amplitude: 1.0
                                #   num_full_distractions: 3      full-length distractors
                                #   num_window_distractions: 3    windowed distractors
                                #   train_ratio: 0.7              this dataset owns its
                                #   test_ratio: 0.15              partition, so these
                                #                                 replace train_split and
                                #                                 val_split, which are
                                #                                 ignored (a mismatch is
                                #                                 warned about)
                                #   seed: 42                      drives generation and the
                                #                                 partition, as upstream
                                # Ground truth lives in a separate metadata.json, one row per
                                # sample: ground_truth = {class_index: [regions]} or a flat
                                # [regions] list, plus non_discriminative. Region frequencies
                                # are in Hz and the row records the sampling_rate they are
                                # relative to; without one, a frequency is read as cycles per
                                # series.

train_config:
  default_settings:
    hyperparams:            # each key is a keyword argument of train_model; the values
                            # mirror its defaults and a test keeps the two in step
      epochs: 20            # epochs to run in this call (a resumed run continues the count)
      batchsize: 8          # batchsize for model training
      loss_func: "crossentropy"   # which torch loss to train with: "crossentropy" (default),
                            #   "bcewithlogits", "nll", or a dotted path to any loss class,
                            #   e.g. "torch.nn.MultiMarginLoss". Matched case-insensitively.
                            #   The loss is checked against the targets on one batch before
                            #   the first epoch: a loss that reads class indices given
                            #   per-output targets is an error, because it would not fail,
                            #   it would optimise a different objective.
      loss_params: {}       # constructor arguments for the loss, e.g.
                            #   {weight: [1.0, 3.2, 0.8]} for crossentropy, or
                            #   {pos_weight: [1.0, 2.0, 1.0]} for bcewithlogits. Lists are
                            #   converted to float32 tensors. Both weighting arguments
                            #   default to none in torch, which means unweighted - not
                            #   balanced: a majority class dominates in proportion to its
                            #   frequency unless you say otherwise.
      optimizer: "adam"     # "adam" (default), "adamw", "sgd" or "rmsprop", or a dotted path
                            #   to any optimizer class, e.g. "torch.optim.NAdam". Matched
                            #   case-insensitively.
      optimizer_params: {}  # constructor arguments beyond the learning rate, e.g.
                            #   {momentum: 0.9, nesterov: true} for sgd
      learn_rate: 0.001     # optimizer learning rate
      patience: 3           # epochs without a >0.005 improvement before early stopping
      save_best: true       # true = keep the best epoch by validation loss (training loss
                            #   when there is no val split); false = keep the final epoch
    train: true             # switch: true trains, false (or omitting the key) does not.
  models:                   # REQUIRED. List of {model: <name>, init_params: {...}} entries.
                            # init_params left out or set to null are auto-detected:
                            #   num_classes -> number of unique classes in training labels
                            #   in_channels -> data.shape[1] (channel dim, after BCT normalisation)
                            # The init_params of each built-in are listed below with the
                            # default the class itself uses; give only what you want to change.
    - model: FCN            # Fully Convolutional Network (Wang et al. 2017)
                            # init_params (defaults from xai4tsc.models.FCN):
                            #   filters: [128, 256, 128]   conv filters per block
                            #   kernel_sizes: [8, 5, 3]    kernel size per block
    - model: LeNet          # shallow LeNet-style 1D CNN (Wagner et al. 2024)
                            # init_params (defaults from xai4tsc.models.LeNet):
                            #   head_hidden: 128           width of the hidden FC layer
    - model: ResNet         # residual TSC baseline (Wang et al. 2017)
                            # init_params (defaults from xai4tsc.models.ResNet):
                            #   n_feature_maps: 64         base conv width F; blocks use F, 2F, 2F
                            #   kernel_sizes: [8, 5, 3]    kernels of the 3 convs per block
    - model: LSTM           # (bi)LSTM recurrent baseline; mean-pool over time
                            # init_params (defaults from xai4tsc.models.LSTM):
                            #   hidden_size: 128           features per LSTM hidden state
                            #   num_layers: 2              stacked LSTM layers
                            #   bidirectional: true        head width doubles when true
                            #   dropout: 0.0               between layers (ignored if num_layers == 1)
    - model: XLSTM          # mLSTM (parallel, clean-room; Beck et al. 2024)
                            # init_params (defaults from xai4tsc.models.XLSTM):
                            #   embed_dim: 128             model width (divisible by num_heads)
                            #   num_blocks: 2              stacked mLSTM blocks
                            #   num_heads: 4               mLSTM heads (must divide embed_dim)
                            #   dropout: 0.0               block residual-branch dropout
    - model: PatchTST       # channel-independent patch transformer (Nie et al. 2023)
                            # init_params (defaults from xai4tsc.models.PatchTST):
                            #   d_model: 128               embedding dim (divisible by nhead)
                            #   patch_len: 16              length of each patch
                            #   stride: 8                  step between patches (< patch_len overlaps)
                            #   num_layers: 3              transformer-encoder layers
                            #   nhead: 8                   attention heads (must divide d_model)
                            #   dim_feedforward: 256       encoder feed-forward width
                            #   dropout: 0.1               dropout inside the encoder

    # EXAMPLE - an external (non-built-in) model. Give a unique 'model' name plus the
    #   class and the source file it lives in; it is imported and registered
    #   automatically. Requires general.allow_external_code: true. Explainer and metric
    #   entries take the same two keys.
    # - model: MyModel
    #   class_name: MyModel           # class defined in the source file
    #   class_path: ./my_model.py     # path to the .py source file
    #   init_params:
    #     hidden_size: 64

    # EXAMPLE - evaluate a pre-trained checkpoint without retraining it. Omit 'train'
    #   (or set it false) and point 'model_ckpt_path' at a .pt file: either a
    #   <Model>_epoch_<N>.pt from an earlier run, or a model_dict.pt written by
    #   xai4tsc.models.save_model(). The <checkpoint>_config.json beside it (e.g.
    #   FCN_epoch_10_config.json) records the model name, the resolved init_params and
    #   the epoch reached, so init_params need not be restated; values from that file
    #   win over this config, because the weights only fit the architecture they were
    #   trained with.
    # - model: FCN
    #   model_ckpt_path: ./results/my_experiment/ECG200/FCN/FCN_epoch_10.pt
    #   train: false

    # EXAMPLE - fine-tune from a checkpoint instead of scoring it as-is: set 'train' on
    #   the entry itself; only the value inherited from default_settings is dropped for
    #   checkpoint entries. Epoch counting CONTINUES, so resuming FCN_epoch_10.pt with
    #   epochs: 5 writes FCN_epoch_11.pt ... FCN_epoch_15.pt rather than restarting at 1.
    # - model: FCN
    #   model_ckpt_path: ./results/my_experiment/ECG200/FCN/FCN_epoch_10.pt
    #   train: true
    #   hyperparams:
    #     epochs: 5

explanation_config:
  default_settings:
    # As in data_config: these mirror the package defaults and a test holds them
    # in step.
    target: "predicted"     # class an attribution explains and is scored against:
                            # "predicted", "label", or "all" (one explanation per class).
                            # Under a per-output encoding (encode: "multihot") a
                            # prediction is a SET of labels, so all three stack one
                            # attribution per output; "label" and "predicted" then mark
                            # which outputs each sample is scored for - the labels it
                            # carries, or those over `threshold`. Every metric then sees
                            # only the samples that carry the output it is scoring.
    threshold: 0.5          # decision threshold on a per-output probability. Read only
                            # for a per-output encoding with target: "predicted", where
                            # it decides which outputs each sample is explained for, and
                            # so how many samples each output's score is over. That count
                            # is the `samples` column of metrics.csv: it moves with the
                            # model and with this value, so scores are not comparable
                            # without it
    visualization_type:
      - "points"            # Available: points (default), background, intensity, bar, graph
    samples:                # which test samples to explain. Metrics score only these, so
                            # this also decides the subset every number refers to
      type: "index"         # "index", "random", or "all" (every sample in the test split)
      indices: [0]          # Used when type = "index"
      count: 5              # Used when type = "random"
    save_exp_values: false  # true = save exp_values, indices, labels as .npy
  explainers:               # REQUIRED. List of {method: <name>, ...} entries.
                            # Each method's parameters are listed below with the default the
                            # class itself uses; give only what you want to change. Wrapper
                            # methods nest their base method under 'base'.
                            # An entry's top-level keys are the explainer's constructor
                            # arguments. Options a method takes per call instead go in a
                            # nested 'call_params' block: these are passed to explain() and
                            # recorded on the explanation, so the metrics that re-explain
                            # reproduce the same call. No built-in explainer reads one.
    - method: Guided_Backpropagation
    - method: Deconvolution
    - method: Integrated_Gradients
                            # params (defaults from IntegratedGradientsExplainer):
                            #   multiply_by_inputs: true   multiply by (input - baseline)
                            #   n_steps: 50                steps along the integration path
                            #   integration_method: "gausslegendre"   quadrature rule; also
                            #     riemann_trapezoid / riemann_middle / riemann_right / riemann_left
                            #   baselines: 0               reference input for the baseline
                            #   internal_batch_size: null   batch size Captum uses internally
    - method: DeepLift
                            # params (defaults from DeepLiftExplainer):
                            #   multiply_by_inputs: true   matches the original DeepLIFT paper
                            #   eps: 1.0e-10               numerical stability constant
    - method: Occlusion
                            # params (defaults from OcclusionExplainer):
                            #   window_shape: null         [channels, timesteps] patch size;
                            #     null is normalised to [1, 5]
                            #   strides: 1                 sliding-window step; must not exceed
                            #     any dimension of window_shape
                            #   baseline: 0                value filling the occluded region
    - method: TSHAP         # exact 2-player Shapley over time windows (Le Nguyen & Ifrim 2025)
      background_data: train_set    # runner selector resolved to an ndarray before the
                                    #   explainer sees it: train_set | test_set | val_set
                            # params (defaults from TSHAPExplainer):
                            #   window_length: 0.1         float in (0,1] = fraction of T, or int
                            #   stride: 5                  Shapley every `stride` window start,
                            #     interpolated in between
                            #   perturb_baseline: "centroid"   background: centroid (needs
                            #     background_data) | black | white | mean | random
                            #   perturb_func: null         name/dotted path to
                            #     (arr, indices, **kwargs) -> arr
                            #   n_perturb_samples: 1       background draws to average (Eq. 8);
                            #     only meaningful for "random"
                            #   channel_mode: "shared"     one value per window, broadcast; or
                            #     "per_channel" (C x cost)
                            #   roi: false                 true = TSHAP-ROI region attribution
                            #     (Algorithm 2; sharper, higher precision)
                            #   seed: 0xDEADBEEF           seed for the "random" baseline; a local
                            #     generator is rebuilt per call, so repeated explanations agree
    - method: SIGN          # wrapper: extends a gradient method with the SIGN rule
                            #   (Gumpfer et al. 2023)
      base:                 # REQUIRED: the gradient method SIGN wraps, with its own params
        method: Integrated_Gradients
        multiply_by_inputs: false   # REQUIRED: SIGN replaces "x input" with "x sign(input)",
                                    #   so the base must emit the raw gradient
                            # params (defaults from SIGNExplainer):
                            #   mu: 0.0                    sign threshold: input < mu -> -1, else +1
    - method: FreqRISE      # frequency-masking perturbation attribution (Brüsch et al. 2025)
      domain: stft          # "fft" (real FFT -> FREQUENCY) or "stft" (-> TIME_FREQUENCY)
      transform:            # REQUIRED for domain=stft; must be omitted for domain=fft, which
        name: stft          #   attaches its own rFFT transform
        params:
          n_fft: 64
          win_length: 64
          hop_length: 32
                            # params (defaults from FreqRISEExplainer):
                            #   batch_size: 10             masks per forward batch
                            #   num_batches: 300           mask batches to average over
                            #   num_cells: 8               coarse mask-grid resolution;
                            #     num_cells//2 MUST be < the smallest transform dim
                            #     (n_freq, and n_time for stft)
                            #   probability_of_keep: 0.5   Bernoulli keep probability, = E[M]
                            #     in the relevance normalisation
                            #   seed: 0xDEADBEEF           seed for the mask draw, rebuilt per call
                            #     from a local generator; the global torch stream is never touched.
                            #     Masks align by a sample's position within one call, so a metric
                            #     that re-explains in chunks (Quantus batches at 64) matches the
                            #     attribution it scores only while the explained samples fit one
                            #     chunk. Vary the seed or raise num_batches to see estimator spread
    - method: Frequency     # explanation-space wrapper: lifts a base method's relevance into
                            #   the frequency domain (Rezaei & Liu 2024)
      base:                 # REQUIRED: the time-domain attributor to lift, with its own params
        method: Integrated_Gradients
      transform:            # defaults to the full FFT when omitted
        name: fft
        params: {}
    - method: TimeFrequency # explanation-space wrapper: lifts into the time-frequency domain
      base:
        method: Guided_Backpropagation
      transform:            # REQUIRED: there is no sensible default window
        name: stft
        params:
          n_fft: 64
          win_length: 64
          hop_length: 32
    - method: Random_Frequency      # uniform-random baseline in the frequency domain, as a
                                    #   sanity check for metrics
      transform:
        name: fft
        params: {}
                            # params (defaults from RandomFrequencyExplainer):
                            #   seed: 0xDEADBEEF           seed for the relevance draw, rebuilt per
                            #     call, so the same seed always gives the same map. The draw reads
                            #     only the shape of the data, never its values, so vary the seed to
                            #     get a different baseline
    - method: Random_TimeFrequency  # uniform-random baseline in the time-frequency domain
      transform:            # REQUIRED time-frequency transform
        name: stft
        params:
          n_fft: 64
          win_length: 64
          hop_length: 32
                            # params (defaults from RandomTimeFreqExplainer):
                            #   seed: 0xDEADBEEF           seed for the relevance draw, rebuilt per
                            #     call, so the same seed always gives the same map. The draw reads
                            #     only the shape of the data, never its values, so vary the seed to
                            #     get a different baseline

evaluation_config:
  default_settings:
    metric_class_params:
      normalise: true
      abs: true
      disable_warnings: true
      display_progressbar: true
      return_aggregate: true
    metric_call_params:
      softmax: true         # whether the metric sees probabilities or raw logits when it
                            # re-queries the model. Only perturbation-based metrics read it
                            # (Pixel-Flipping, Faithfulness *, Monotonicity *, Selectivity,
                            # SensitivityN, Sufficiency, Region Segmentation, ...);
                            # attribution-only metrics such as Complexity ignore it.
                            # Models here emit raw logits from forward() by contract, so
                            # false makes those metrics score unnormalised values: unbounded,
                            # possibly negative, and not comparable across models, datasets
                            # or runs. Set it to false only for an external model that
                            # already ends in a Softmax layer.
      channel_first: true   # axis order of the data as the metric sees it. Everything
                            # downstream of loading is (B, C, T), so true is right for
                            # every shipped dataset; a dataset's `layout` is about its
                            # file and is already resolved by then.
  metrics:                  # REQUIRED. List of {metric: <name>, ...} entries.
                            # Metric names are case-sensitive display names (unlike model and
                            # explainer names, which are matched case-insensitively), and an
                            # unregistered one is a config error.
                            # Each metric's parameters are listed below with the value the
                            # metric's own class defaults to. To SET one, nest it under
                            # 'metric_class_params' (constructor) or 'metric_call_params'
                            # (call time) on the entry or in default_settings above -
                            # a parameter written at an entry's top level is not read.
                            # Explanation domains: the Quantus metrics are grouped by
                            # what they read. 'Complexity', 'Effective Complexity' and
                            # 'Sparseness' read the attribution alone and so score a
                            # frequency or time-frequency explanation too; the other 34
                            # perturb the input, need ground-truth masks, or re-explain,
                            # and need the explanation in the model-native domain, the
                            # one the model's inputs live in (the time domain for every
                            # dataset shipped here).
                            # Per-entry runner keys, available on every metric:
                            #   animate: false        write a GIF of the perturbation curve;
                            #     only the perturbation metrics implement it, others warn
                            #   animate_sample: 0     index within the explained samples
                            #   animate_fps: 2        frames per second
    - metric: AUC
    - metric: Attribution Localisation
                            # params (set via metric_class_params):
                            #   weighted: false                weight attributions by their magnitude
                            #   max_size: 1.0                  max fraction of input area considered as "region"
                            #   positive_attributions: false   only consider positive attribution values
    - metric: Avg-Sensitivity
                            # params (set via metric_class_params):
                            #   nr_samples: 200    number of perturbation samples
                            #   lower_bound: 0.2   radius of the perturbation ball
    - metric: Completeness
                            # params (set via metric_class_params):
                            #   perturb_baseline: "black"   baseline for perturbed features: black, white, mean, random
    - metric: Complexity    # attribution-only: scores any explanation domain
    - metric: Consistency
    - metric: Continuity Test
                            # params (set via metric_class_params):
                            #   nr_steps: 28                number of perturbation steps along the translation path
                            #   perturb_baseline: "black"   baseline for perturbed region
    - metric: Effective Complexity 
                            # attribution-only: scores any explanation domain
                            # params (set via metric_class_params):
                            #   eps: 1.0e-5   threshold below which an attribution is considered zero
    - metric: Efficient MPRT
                            # params (set via metric_class_params):
                            #   layer_order: "bottom_up"   layer traversal order: bottom_up or top_down
                            #   seed: 42                   random seed for weight randomisation
                            #   skip_layers: true          skip layers without learnable parameters
    - metric: Faithfulness Correlation
                            # params (set via metric_class_params):
                            #   nr_runs: 100                number of random subset samples
                            #   subset_size: 0.05           fraction of series length T (converted to int at runtime)
                            #   perturb_baseline: "black"   value used to replace perturbed features
    - metric: Faithfulness Estimate
                            # params (set via metric_class_params):
                            #   features_in_step: 1         number of features perturbed per step
                            #   perturb_baseline: "black"   value used to replace perturbed features
    - metric: Focus
    - metric: IROF
                            # params (set via metric_class_params):
                            #   segmentation_method: "slic"   segmentation algorithm: slic or patches
                            #   perturb_baseline: "mean"      baseline for occluded segments
    - metric: Infidelity
                            # params (set via metric_class_params):
                            #   loss_func: "mse"            loss between perturbed and original predictions: mse or cross_entropy
                            #   n_perturb_samples: 10       number of random perturbation vectors
                            #   perturb_baseline: "black"   baseline for perturbed region
    - metric: InputInvariance
                            # params (set via metric_class_params):
                            #   input_shift: -1   constant added to the input (tests shift-invariance of attributions)
    - metric: Local Lipschitz Estimate
                            # params (set via metric_class_params):
                            #   nr_samples: 200     number of perturbation samples
                            #   perturb_mean: 0.0   mean of Gaussian perturbation
                            #   perturb_std: 0.1    standard deviation of Gaussian perturbation
    - metric: MPRT
                            # params (set via metric_class_params):
                            #   layer_order: "top_down"   layer traversal order: top_down or bottom_up
                            #   seed: 42                  random seed for weight randomisation
                            #   skip_layers: false        skip layers without learnable parameters
    - metric: Max-Sensitivity
                            # params (set via metric_class_params):
                            #   nr_samples: 200    number of perturbation samples
                            #   lower_bound: 0.2   radius of the perturbation ball
    - metric: Monotonicity-Arya
                            # params (set via metric_class_params):
                            #   features_in_step: 1         number of features added per step
                            #   perturb_baseline: "black"   baseline for masked features
    - metric: Monotonicity-Nguyen
                            # params (set via metric_class_params):
                            #   features_in_step: 1         number of features added per step
                            #   perturb_baseline: "black"   baseline for masked features
    - metric: NonSensitivity
                            # params (set via metric_class_params):
                            #   eps: 1.0e-5                 threshold: features with attribution below eps are "non-sensitive"
                            #   features_in_step: 1         number of features perturbed per step
                            #   perturb_baseline: "black"   baseline for perturbed features
    - metric: Pixel-Flipping
                            # params (set via metric_class_params):
                            #   features_in_step: 1         number of features flipped per step (higher = coarser curve)
                            #   perturb_baseline: "black"   value substituted for flipped features
    - metric: Pointing Game
                            # params (set via metric_class_params):
                            #   weighted: false   weight hits by attribution magnitude
    - metric: ROAD
                            # params (set via metric_class_params):
                            #   noise: 0.01   noise level added when replacing removed features
    - metric: Random Logit
                            # params (set via metric_class_params):
                            #   num_classes: 1000   total number of output classes; set it to your dataset's
                            #   seed: 42            random seed for logit selection
    - metric: Region Segmentation
                            # params (set via metric_class_params):
                            #   patch_size: 8               side length of each patch region (in timesteps for 1-D input)
                            #   order: "morf"               evaluation order: morf (most-relevant-first) or lerf
                            #   regions_evaluation: 100     number of regions to evaluate
                            #   perturb_baseline: "black"   baseline for occluded regions
    - metric: Relative Input Stability
                            # params (set via metric_class_params):
                            #   nr_samples: 200   number of perturbed input samples
                            #   eps_min: 1.0e-6   minimum denominator value to avoid division by zero
    - metric: Relative Output Stability
                            # params (set via metric_class_params):
                            #   nr_samples: 200   number of perturbed input samples
                            #   eps_min: 1.0e-6   minimum denominator value to avoid division by zero
    - metric: Relative Representation Stability
                            # params (set via metric_class_params):
                            #   nr_samples: 200   number of perturbed input samples
                            #   eps_min: 1.0e-6   minimum denominator value to avoid division by zero
    - metric: Relevance Mass Accuracy
    - metric: Relevance Rank Accuracy
    - metric: Selectivity
                            # params (set via metric_class_params):
                            #   patch_size: 8               side length of each patch occluded per step (in timesteps)
                            #   perturb_baseline: "black"   value substituted for occluded features
    - metric: SensitivityN
                            # params (set via metric_class_params):
                            #   n_max_percentage: 0.8       maximum fraction of features to include in subset
                            #   features_in_step: 1         number of features added per step
                            #   perturb_baseline: "black"   baseline for non-selected features
    - metric: Smooth MPRT
                            # params (set via metric_class_params):
                            #   layer_order: "bottom_up"   layer traversal order
                            #   seed: 42                   random seed for weight randomisation
                            #   nr_samples: 50             number of noise samples for smoothing
                            #   noise_magnitude: 0.1       magnitude of Gaussian noise added to weights
    - metric: Sparseness                  # attribution-only: scores any explanation domain
    - metric: Sufficiency
                            # params (set via metric_class_params):
                            #   threshold: 0.6                fraction of features considered "sufficient" for classification
                            #   distance_func: "seuclidean"   distance function for comparing predictions: seuclidean, cosine, etc.
    - metric: Top-K Intersection
                            # params (set via metric_class_params):
                            #   k: 0.1                     fraction of series length T (converted to int at runtime)
                            #   concept_influence: false   weight intersection by concept influence scores
    - metric: Frequency Perturbation       # frequency pixel-flipping; needs a FREQUENCY explainer
                            # params (set via metric_class_params):
                            #   features_in_step: 1            frequency coefficients perturbed per step
                            #   perturb_baseline: 0.0          value perturbed coefficients are set to
                            #   return_aoc_per_sample: false   true = per-sample AOC (1 - AUC/steps); false = raw curves
    - metric: Time-Frequency Perturbation  # STFT pixel-flipping; needs a TIME_FREQUENCY explainer
                            # params (set via metric_class_params):
                            #   features_in_step: 5
                            #   perturb_baseline: 0.0
                            #   return_aoc_per_sample: false
    - metric: Time-Frequency Perturbation Gaussian  # softer, Gaussian-smeared TF perturbation
                            # params (set via metric_class_params):
                            #   features_in_step: 5
                            #   perturb_baseline: 0.0
                            #   return_aoc_per_sample: false
    - metric: Time-Frequency AUC
                            # params (set via metric_class_params):
                            #   return_aggregate: true   true = mean AUC over valid samples; false = per-sample list
                            #   abs_attribution: true    rank by attribution magnitude (false = signed value)
                            #   sigma: [5.0, 1.0]        Gaussian kernel std (frequency, time)
